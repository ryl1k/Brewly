[project]
name = "brewly"
version = "1.0.0"
description = "Brewly: coffee subscriptions (Supfeel demo target)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "python-dotenv>=1.0",
]

[tool.vercel]
entrypoint = "brewly.api:app"
